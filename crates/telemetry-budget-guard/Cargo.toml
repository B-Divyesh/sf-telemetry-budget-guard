[package]
name = "telemetry-budget-guard"
version = "0.1.0"
edition = "2024"
description = "A local CI budget gate for OpenTelemetry volume and cardinality changes"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-telemetry-budget-guard"
readme = "../../README.md"
keywords = ["opentelemetry", "observability", "cli", "ci"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "../../README.md", "../../LICENSE"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
regex = "1"

[dev-dependencies]
tempfile = "3"
